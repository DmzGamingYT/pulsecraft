[package]
name = "pulse-core"
version = "0.1.0"
edition = "2021"
description = "Noyau de calcul santé et entraînement de PulseCraft (Rust → WebAssembly)"
license = "MIT"
repository = "https://github.com/DmzGamingYT/pulsecraft"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
