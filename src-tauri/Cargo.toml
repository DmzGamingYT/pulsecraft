[package]
name = "pulsecraft"
version = "0.1.0"
description = "PulseCraft — suivi sportif et santé local-first, avec coach IA"
authors = ["PulseCraft contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/DmzGamingYT/pulsecraft"

[lib]
name = "pulsecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
