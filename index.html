<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="PulseCraft — suivi sportif et santé open source, local-first, avec un coach IA. Vos données restent sur votre appareil."
    />
    <meta name="theme-color" content="#f4f2ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="PulseCraft — vos données de santé restent chez vous" />
    <meta
      property="og:description"
      content="Entraînements, sommeil, corps, nutrition et coach IA. Open source, sans compte, sans cloud."
    />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>PulseCraft — suivi sportif & santé</title>
    <script>
      // Le thème est appliqué avant la première peinture : pas de flash blanc.
      try {
        var stored = localStorage.getItem('pc.theme');
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>PulseCraft nécessite JavaScript pour fonctionner.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
